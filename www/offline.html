<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>DersoLab — Bağlantı Kontrolü</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #080B11;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 340px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.15);
      color: #FBBF24;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 10px;
      color: #FFFFFF;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #94A3B8;
      margin: 0 0 24px;
    }
    button {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #F59E0B, #EA580C);
      color: #080B11;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">DERSOLAB AKADEMİ</div>
    <h1>İnternet Bağlantısı Bekleniyor</h1>
    <p>DersoLab canlı ders odalarına, 3D laboratuvarlara ve AI soru asistanına erişmek için lütfen internet bağlantınızı kontrol edin.</p>
    <button onclick="window.location.href='https://dersolab.com'">Tekrar Bağlan</button>
  </div>
</body>
</html>
