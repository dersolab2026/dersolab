name: Katılım Hatırlatma Cron

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        run: |
          curl -sf -X POST "https://dersolab.com/api/cron/send-engagement-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
